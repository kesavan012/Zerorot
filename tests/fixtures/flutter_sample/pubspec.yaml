name: geosight
description: GeoSight - A total station companion app for digital theodolite measurements, stakeout, traverse surveys, and sensor calibration. Built with Flutter for mobile and React for the interactive web playground.
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sensors_plus: ^4.0.0
  camera: ^0.10.5
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  flutter_blue_plus: ^1.31.5
  path_provider: ^2.1.1
  csv: ^5.1.1
  share_plus: ^7.2.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
