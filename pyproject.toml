[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerorot"
version = "1.0.0"
description = "Auto-generate production-ready README.md files from pure static code analysis — no AI API required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kesavan012", email = "hello@zerorot.com" }]
keywords = ["readme", "documentation", "static-analysis", "cli", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "chardet>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
toml = ["tomli>=2.0; python_version<'3.11'"]

[project.scripts]
zerorot = "zerorot.cli:main"

[project.urls]
Homepage = "https://github.com/kesavan012/Zerorot"
Repository = "https://github.com/kesavan012/Zerorot"
"Bug Tracker" = "https://github.com/kesavan012/Zerorot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zerorot*"]

[tool.setuptools.package-data]
zerorot = ["templates/*.j2", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["zerorot"]
omit = ["tests/*"]
